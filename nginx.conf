server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La caméra n'est autorisée que pour ce site.
    add_header Permissions-Policy "camera=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:" always;
    }

    gzip on;
    gzip_types text/css application/javascript;
}
